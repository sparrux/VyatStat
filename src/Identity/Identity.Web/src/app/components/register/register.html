<div class="register-wrapper">
  <!-- Иконка информации в правом верхнем углу -->
  <button class="info-btn" type="button" aria-label="Информация">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
  </button>

  <div class="register-card">
    <!-- Логотип (Горы) -->
    <div class="logo-container">
      <svg viewBox="0 0 100 60" width="100" height="60" class="logo-icon">
        <path d="M15 50 L40 15 L55 35 L70 20 L90 50 Z" fill="none" stroke="#8c8273" stroke-width="4" stroke-linejoin="round"/>
        <path d="M45 40 L50 35 L55 42" fill="none" stroke="#8c8273" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="50" cy="12" r="4" fill="#8c8273"/>
      </svg>
    </div>

    <h2>Регистрация</h2>
    <p class="subtitle">Создайте аккаунт, чтобы начать</p>

    <!-- Форма отправки данных -->
    <form (submit)="onSubmit($event)">

      <!-- Поле Логин -->
      <div class="form-group">
        <label for="username">Логин</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" id="username" placeholder="Введите логин" [(ngModel)]="username" name="username" required>
        </div>
      </div>

      <!-- Поле Пароль -->
      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Введите пароль" [(ngModel)]="password" name="password" required>
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword" aria-label="Показать пароль">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Поле Повторите пароль -->
      <div class="form-group">
        <label for="confirmPassword">Повторите пароль</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" placeholder="Повторите пароль" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword" aria-label="Показать подтверждение пароля">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Кнопка регистрации -->
      <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>


    <div *ngIf="errors.length > 0" class="error-list">
      <ul>
        <li *ngFor="let err of errors">{{ err }}</li>
      </ul>
    </div>

    <div class="divider">
      <span>или</span>
    </div>

    <!-- Кнопка возврата на логин -->
    <button type="button" class="login-redirect-btn" routerLink="/login">
      Есть аккаунт? <span class="accent-text">Войдите</span>
    </button>
  </div>
</div>
