<app-dialog-shell title="Change password" (closed)="onCancel()">
  <p class="change-password-dialog__hint">
    Enter your current password and choose a new one.
  </p>

  <form class="change-password-dialog__form" (submit)="onSave(); $event.preventDefault()" novalidate>
    <label class="vt-field">
      <span class="vt-field__label">Current password</span>
      <input
        class="vt-field__input"
        type="password"
        name="currentPassword"
        autocomplete="current-password"
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        [disabled]="isSaving()"
        placeholder="Enter your current password"
      />
    </label>

    <label class="vt-field">
      <span class="vt-field__label">New password</span>
      <input
        class="vt-field__input"
        type="password"
        name="newPassword"
        autocomplete="new-password"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        [disabled]="isSaving()"
        placeholder="Enter your new password"
      />
    </label>

    @if (saveError(); as saveErr) {
      <p class="change-password-dialog__error" role="alert">{{ saveErr }}</p>
    }
  </form>

  <button
    dialogActions
    type="button"
    class="vt-btn vt-btn--secondary"
    [disabled]="isSaving()"
    (click)="onCancel()"
  >
    Cancel
  </button>
  <button
    dialogActions
    type="button"
    class="vt-btn vt-btn--primary"
    [disabled]="isSaving()"
    (click)="onSave()"
  >
    {{ isSaving() ? 'Saving…' : 'Save' }}
  </button>
</app-dialog-shell>
