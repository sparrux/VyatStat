<div class="vt-dialog" role="dialog" aria-modal="true" [attr.aria-label]="title() ?? 'Dialog'">
  @if (title(); as dialogTitle) {
    <header class="vt-dialog__header">
      <h2 class="vt-dialog__title">{{ dialogTitle }}</h2>
      @if (showCloseButton()) {
        <button
          type="button"
          class="vt-dialog__close"
          aria-label="Close"
          (click)="onCloseClick()"
        >
          ×
        </button>
      }
    </header>
  }

  <div class="vt-dialog__body">
    <ng-content />
  </div>

  <footer class="vt-dialog__footer">
    <ng-content select="[dialogActions]" />
  </footer>
</div>
