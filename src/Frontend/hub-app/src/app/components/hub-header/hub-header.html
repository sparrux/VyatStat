<header class="hub-header">
  <div class="hub-header__inner">
    <div class="hub-header__start">
      <a routerLink="/" class="hub-header__brand" aria-label="Vyatka Hub">
        <img
          class="hub-header__brand-logo"
          src="/logo.png"
          alt=""
          width="40"
          height="40"
          decoding="async"
        />
      </a>

      <span class="hub-header__divider" aria-hidden="true"></span>

      <nav class="hub-header__section" aria-label="Страницы">
        <div class="hub-header__menu">
          <button
            type="button"
            class="hub-header__link hub-header__menu-trigger"
            aria-label="События"
            aria-haspopup="menu"
          >
            <svg class="hub-header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M3 10h18" />
              <path d="M8 3v4" />
              <path d="M16 3v4" />
            </svg>
            <span class="hub-header__label">События</span>
            <span class="hub-header__chevron-wrap" aria-hidden="true">
              <span class="hub-header__chevron"></span>
            </span>
          </button>
          <div class="hub-header__menu-panel" role="menu">
            <a
              class="hub-header__menu-item"
              role="menuitem"
              href="#"
              (click)="$event.preventDefault()"
            >
              <svg class="hub-header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M3 10h18" />
                <path d="M8 3v4" />
                <path d="M16 3v4" />
                <path d="M12 13v5" />
                <path d="M9.5 15.5h5" />
              </svg>
              <span>Новое событие</span>
            </a>
            <a
              class="hub-header__menu-item"
              role="menuitem"
              href="#"
              (click)="$event.preventDefault()"
            >
              <svg class="hub-header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M3 10h18" />
                <path d="M8 3v4" />
                <path d="M16 3v4" />
                <path d="M8 14h3" />
                <path d="M8 17h8" />
              </svg>
              <span>Мои события</span>
            </a>
          </div>
        </div>

        <a
          class="hub-header__link"
          href="#"
          aria-label="Группы"
          (click)="$event.preventDefault()"
        >
          <svg class="hub-header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="9" cy="8" r="3.25" />
            <circle cx="17" cy="9.5" r="2.5" />
            <path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
            <path d="M14.2 14.7c1.4-.5 3-.4 4.3.6 1 .8 1.6 2 1.8 3.7" />
          </svg>
          <span class="hub-header__label">Группы</span>
        </a>

        <a
          class="hub-header__link"
          href="#"
          aria-label="Аккаунт"
          (click)="$event.preventDefault()"
        >
          <svg class="hub-header__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 19.5c1-3.6 3.4-5.5 7-5.5s6 1.9 7 5.5" />
          </svg>
          <span class="hub-header__label">Аккаунт</span>
        </a>
      </nav>
    </div>

    <div class="hub-header__end">
      <div
        class="hub-header__user"
        [attr.aria-label]="user()?.nickname ?? 'Пользователь'"
      >
        <span class="hub-header__avatar" aria-hidden="true">
          {{ userInitials() }}
        </span>
      </div>
    </div>
  </div>
</header>
